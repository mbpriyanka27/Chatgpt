<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LocalGPT Pro Auth</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: #f1f5f9;
    }
    .auth-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #ffffff;
      color: #1e293b;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .google-btn:hover {
      background: #f8fafc;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #64748b;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #334155;
    }
    .divider span {
      padding: 0 10px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .submit-btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .submit-btn:hover {
      background: #0369a1;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .success-msg {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: #38bdf8;
      text-decoration: none;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div id="errorBox" class="error-msg"></div>
    <div id="successBox" class="success-msg"></div>

    <button id="googleBtn" class="google-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26a5.4 5.4 0 0 1-8.09-2.85H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33A5.4 5.4 0 0 1 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider"><span>or continue with email</span></div>

    <div class="tabs">
      <div id="tabLogin" class="tab active" onclick="switchTab('login')">Sign In</div>
      <div id="tabSignup" class="tab" onclick="switchTab('signup')">Create Account</div>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label>Full Name</label>
        <input type="text" id="nameInput" placeholder="John Doe">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="emailInput" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" required placeholder="Min 8 characters">
      </div>

      <a id="forgotLink" class="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>

      <button type="submit" id="submitBtn" class="submit-btn">Sign In</button>
    </form>
  </div>

  <script>
    let currentMode = 'login';
    let firebaseConfig = null;

    // Streamlit Component Handshake
    function sendTokenToStreamlit(tokenData) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: tokenData
      }, "*");
    }

    function initFirebase(config) {
      if (!firebase.apps.length) {
        firebase.initializeApp(config);
      }
    }

    window.addEventListener("message", function(event) {
      if (event.data.type === "streamlit:render") {
        const args = event.data.args;
        if (args && args.firebase_config) {
          firebaseConfig = args.firebase_config;
          initFirebase(firebaseConfig);
        }
      }
    });

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.textContent = msg;
      box.style.display = "block";
      document.getElementById("successBox").style.display = "none";
    }

    function showSuccess(msg) {
      const box = document.getElementById("successBox");
      box.textContent = msg;
      box.style.display = "block";
      document.getElementById("errorBox").style.display = "none";
    }

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById("tabLogin").className = mode === 'login' ? 'tab active' : 'tab';
      document.getElementById("tabSignup").className = mode === 'signup' ? 'tab active' : 'tab';
      document.getElementById("nameGroup").style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById("forgotLink").style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById("submitBtn").textContent = mode === 'login' ? 'Sign In' : 'Create Account';
      document.getElementById("errorBox").style.display = "none";
      document.getElementById("successBox").style.display = "none";
    }

    document.getElementById("googleBtn").addEventListener("click", async () => {
      try {
        if (!firebase.apps.length) throw new Error("Firebase not initialized");
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        const token = await result.user.getIdToken();
        sendTokenToStreamlit({
          token: token,
          uid: result.user.uid,
          email: result.user.email,
          name: result.user.displayName,
          photo_url: result.user.photoURL,
          email_verified: result.user.emailVerified,
          provider: 'google.com'
        });
      } catch (err) {
        showError(err.message || "Failed to sign in with Google");
      }
    });

    async function handleSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const name = document.getElementById("nameInput").value.trim();

      try {
        if (!firebase.apps.length) throw new Error("Firebase is not initialized");
        if (currentMode === 'signup') {
          if (password.length < 8) throw new Error("Password must be at least 8 characters");
          const result = await firebase.auth().createUserWithEmailAndPassword(email, password);
          if (name) {
            await result.user.updateProfile({ displayName: name });
          }
          await result.user.sendEmailVerification();
          const token = await result.user.getIdToken();
          showSuccess("Verification email sent! Please check your inbox.");
          sendTokenToStreamlit({
            token: token,
            uid: result.user.uid,
            email: result.user.email,
            name: name || result.user.email.split('@')[0],
            photo_url: null,
            email_verified: result.user.emailVerified,
            provider: 'password'
          });
        } else {
          const result = await firebase.auth().signInWithEmailAndPassword(email, password);
          const token = await result.user.getIdToken();
          sendTokenToStreamlit({
            token: token,
            uid: result.user.uid,
            email: result.user.email,
            name: result.user.displayName || result.user.email.split('@')[0],
            photo_url: result.user.photoURL,
            email_verified: result.user.emailVerified,
            provider: 'password'
          });
        }
      } catch (err) {
        showError(err.message || "Authentication failed");
      }
    }

    async function handleForgotPassword() {
      const email = document.getElementById("emailInput").value.trim();
      if (!email) {
        showError("Please enter your email above and click 'Forgot password?' again.");
        return;
      }
      try {
        await firebase.auth().sendPasswordResetEmail(email);
        showSuccess("Password reset link sent to " + email);
      } catch (err) {
        showError(err.message || "Failed to send reset email");
      }
    }
  </script>
</body>
</html>
