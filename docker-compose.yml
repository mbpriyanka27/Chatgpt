version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chatgpt_postgres
    restart: always
    environment:
      POSTGRES_USER: chatgpt_user
      POSTGRES_PASSWORD: chatgpt_password_2026
      POSTGRES_DB: chatgpt_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatgpt_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chatgpt_user:chatgpt_password_2026@db:5432/chatgpt_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-chatgpt-secret-token-key-2026}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      - db
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatgpt_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:

